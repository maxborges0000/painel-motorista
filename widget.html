<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lançamento Rápido</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="+ Lançar">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06080C">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Josefin+Sans:wght@300;400;600;700&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #06080C;
  --surface: #0C0E14;
  --surface2:#111420;
  --surface3:#161A28;
  --border:  rgba(212,175,95,0.1);
  --border2: rgba(212,175,95,0.22);
  --gold:    #D4AF5F;
  --gold-lt: #F0D080;
  --green:   #4ECDC4;
  --red:     #E05C6B;
  --amber:   #E8A020;
  --text:    #EDE8DC;
  --muted:   #7A7060;
  --dim:     #3D3828;
}

html { overscroll-behavior: none; }

body {
  font-family: 'Josefin Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: flex;
  flex-direction: column;
}

/* ── BG GLOW ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(212,175,95,0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 100%, rgba(78,205,196,0.04) 0%, transparent 55%);
  pointer-events: none;
}

.wrap { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; padding: 0 20px 24px; }

/* ── HEADER ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0 18px;
}
.header-brand {
  display: flex; align-items: center; gap: 10px;
}
.header-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, #2A1F08, #1A1200);
  border: 1px solid rgba(212,175,95,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  box-shadow: 0 0 20px rgba(212,175,95,0.2);
}
.header-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem; font-weight: 600;
  color: var(--gold-lt); letter-spacing: 0.12em;
}
.header-sub {
  font-size: 0.55rem; color: var(--muted); letter-spacing: 0.18em;
  text-transform: uppercase; margin-top: 1px;
}
.header-time {
  font-family: 'DM Mono', monospace;
  font-size: 1rem; font-weight: 500; color: var(--gold);
  letter-spacing: 0.06em;
}

/* ── TYPE TOGGLE ── */
.type-toggle {
  display: flex; gap: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 4px;
  margin-bottom: 22px;
}
.type-btn {
  flex: 1; border: none; border-radius: 10px;
  padding: 11px 0; cursor: pointer;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.72rem; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); background: none;
  transition: all 0.22s;
  -webkit-tap-highlight-color: transparent;
}
.type-btn.active-earn {
  background: linear-gradient(135deg, rgba(78,205,196,0.18), rgba(78,205,196,0.08));
  color: var(--green);
  box-shadow: 0 0 20px rgba(78,205,196,0.12);
  border: 1px solid rgba(78,205,196,0.25);
}
.type-btn.active-spend {
  background: linear-gradient(135deg, rgba(224,92,107,0.18), rgba(224,92,107,0.08));
  color: var(--red);
  box-shadow: 0 0 20px rgba(224,92,107,0.12);
  border: 1px solid rgba(224,92,107,0.25);
}

/* ── FORM ── */
.form { display: flex; flex-direction: column; gap: 14px; flex: 1; }

.field-label {
  font-size: 0.55rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
  font-family: 'Josefin Sans', sans-serif;
}

.input-wrap {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-wrap:focus-within {
  border-color: rgba(212,175,95,0.35);
  box-shadow: 0 0 0 2px rgba(212,175,95,0.07);
}
.input-wrap.earn:focus-within {
  border-color: rgba(78,205,196,0.35);
  box-shadow: 0 0 0 2px rgba(78,205,196,0.07);
}
.input-wrap.spend:focus-within {
  border-color: rgba(224,92,107,0.35);
  box-shadow: 0 0 0 2px rgba(224,92,107,0.07);
}

input, select {
  width: 100%; background: none; border: none; outline: none;
  color: var(--text); font-family: 'Josefin Sans', sans-serif;
  font-size: 0.88rem; letter-spacing: 0.03em;
  -webkit-tap-highlight-color: transparent;
}
select { cursor: pointer; color-scheme: dark; }
input::placeholder { color: var(--dim); }

/* VALUE — big */
.value-input {
  font-family: 'DM Mono', monospace !important;
  font-size: 1.6rem !important;
  font-weight: 500 !important;
  letter-spacing: 0.02em !important;
  color: var(--gold) !important;
}
.value-input.earn { color: var(--green) !important; }
.value-input.spend { color: var(--red) !important; }

.prefix {
  font-family: 'DM Mono', monospace;
  font-size: 0.9rem; color: var(--muted);
  margin-right: 6px; vertical-align: middle;
}

/* row */
.row2 { display: flex; gap: 12px; }
.row2 > * { flex: 1; }

/* ── CONFIRM BTN ── */
.confirm-btn {
  margin-top: auto; padding-top: 8px;
}
.btn-reg {
  width: 100%; border: none; border-radius: 14px;
  padding: 16px; cursor: pointer;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.82rem; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  transition: all 0.22s;
  -webkit-tap-highlight-color: transparent;
  position: relative; overflow: hidden;
}
.btn-reg.earn {
  background: linear-gradient(135deg, #1DB954, #4ECDC4);
  color: #06080C;
  box-shadow: 0 6px 28px rgba(78,205,196,0.3);
}
.btn-reg.spend {
  background: linear-gradient(135deg, #E05C6B, #c0414f);
  color: #fff;
  box-shadow: 0 6px 28px rgba(224,92,107,0.3);
}
.btn-reg:active { transform: scale(0.97); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface3); border: 1px solid var(--border2);
  border-radius: 12px; padding: 11px 20px;
  font-size: 0.78rem; font-family: 'Josefin Sans', sans-serif;
  color: var(--text); white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  opacity: 0; transition: all 0.3s; z-index: 999;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── BACK LINK ── */
.back-bar {
  text-align: center; padding: 14px 0 0;
  font-size: 0.65rem; letter-spacing: 0.12em; color: var(--dim);
  font-family: 'Josefin Sans', sans-serif;
}
.back-bar a {
  color: var(--muted); text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

/* ── SUCCESS FLASH ── */
@keyframes flashGreen {
  0%   { background: rgba(78,205,196,0.12); }
  100% { background: transparent; }
}
@keyframes flashRed {
  0%   { background: rgba(224,92,107,0.12); }
  100% { background: transparent; }
}
.flash-earn { animation: flashGreen 0.5s ease; }
.flash-spend { animation: flashRed 0.5s ease; }
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="header-brand">
      <div class="header-icon">🚗</div>
      <div>
        <div class="header-title">LANÇAR</div>
        <div class="header-sub">Registro rápido</div>
      </div>
    </div>
    <div class="header-time" id="w-clock">--:--</div>
  </div>

  <!-- TIPO: GANHO / GASTO -->
  <div class="type-toggle">
    <button class="type-btn active-earn" id="btn-earn" onclick="setType('earn')">⚡ Ganho</button>
    <button class="type-btn" id="btn-spend" onclick="setType('spend')">💸 Gasto</button>
  </div>

  <!-- FORMULÁRIO -->
  <div class="form">

    <!-- VALOR -->
    <div>
      <div class="field-label">Valor</div>
      <div class="input-wrap earn" id="wrap-value">
        <span class="prefix">R$</span>
        <input type="number" id="w-price" class="value-input earn" inputmode="decimal"
               min="0" step="0.01" placeholder="0,00" autofocus>
      </div>
    </div>

    <!-- CATEGORIA -->
    <div>
      <div class="field-label">Categoria</div>
      <div class="input-wrap earn" id="wrap-cat">
        <select id="w-cat"></select>
      </div>
    </div>

    <!-- DESCRIÇÃO + HORA (linha) -->
    <div class="row2">
      <div>
        <div class="field-label">Descrição</div>
        <div class="input-wrap earn" id="wrap-name">
          <input type="text" id="w-name" placeholder="Opcional">
        </div>
      </div>
      <div style="max-width:110px">
        <div class="field-label">Horário</div>
        <div class="input-wrap earn" id="wrap-time">
          <input type="time" id="w-time">
        </div>
      </div>
    </div>

    <!-- PAGAMENTO -->
    <div>
      <div class="field-label">Pagamento</div>
      <div class="input-wrap earn" id="wrap-pay">
        <select id="w-pay"></select>
      </div>
    </div>

    <!-- REGISTRAR -->
    <div class="confirm-btn">
      <button class="btn-reg earn" id="btn-reg" onclick="register()">
        ＋ REGISTRAR GANHO
      </button>
    </div>

  </div><!-- /form -->

</div><!-- /wrap -->

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
const DATA_KEY   = 'painel-data-v1';
const WALLET_KEY = 'painel-carteira-v1';
const TZ_KEY     = 'painel-tz-offset';

const EARN_CATS  = ['🚗 Corrida','🛵 Entrega','⭐ Bônus','🎯 Meta','💎 Pico','🌙 Surge','📱 App Extra','💵 Gorjeta','➕ Outro'];
const SPEND_CATS = ['⛽ Gasolina','🔋 GNV/Etanol','🍔 Alimentação','🅿️ Estacionamento','🔧 Manutenção','🧼 Lavagem','📱 Plano/Dados','🛡️ Seguro','💊 Saúde','🏦 Uber Taxa','➕ Outro'];
const EARN_PAYS  = ['💵 Dinheiro','📱 PIX','💳 Crédito','💳 Débito'];
const SPEND_PAYS = ['💵 Dinheiro','📱 PIX','💳 Cartão'];

let currentType = 'earn';

// ── CLOCK ────────────────────────────────────────────────────────────────
function tzOffset() { return parseInt(localStorage.getItem(TZ_KEY) || '-3', 10); }
function nowLocal() {
  return new Date(Date.now() + (tzOffset() - (-(new Date().getTimezoneOffset()/60))) * 3600000);
}
function nowStr() {
  const n = nowLocal();
  return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}
function todayStr() {
  const n = nowLocal();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function tickClock() {
  const el = document.getElementById('w-clock');
  if (el) el.textContent = nowStr();
}
setInterval(tickClock, 1000); tickClock();

// ── TYPE SWITCH ──────────────────────────────────────────────────────────
function setType(type) {
  currentType = type;
  const isEarn = type === 'earn';
  const cls    = isEarn ? 'earn' : 'spend';
  const other  = isEarn ? 'spend' : 'earn';

  document.getElementById('btn-earn').className  = 'type-btn ' + (isEarn  ? 'active-earn'  : '');
  document.getElementById('btn-spend').className = 'type-btn ' + (!isEarn ? 'active-spend' : '');

  ['wrap-value','wrap-cat','wrap-name','wrap-time','wrap-pay'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('earn','spend');
    el.classList.add(cls);
  });

  const price = document.getElementById('w-price');
  price.className = 'value-input ' + cls;

  // Populate cats & pays
  const catSel = document.getElementById('w-cat');
  catSel.innerHTML = (isEarn ? EARN_CATS : SPEND_CATS).map(c => `<option value="${c}">${c}</option>`).join('');
  const paySel = document.getElementById('w-pay');
  paySel.innerHTML = (isEarn ? EARN_PAYS : SPEND_PAYS).map(p => `<option value="${p}">${p}</option>`).join('');

  const btn = document.getElementById('btn-reg');
  btn.className = 'btn-reg ' + cls;
  btn.textContent = isEarn ? '＋ REGISTRAR GANHO' : '－ REGISTRAR GASTO';
}

// ── REGISTER ─────────────────────────────────────────────────────────────
function register() {
  const price = parseFloat(document.getElementById('w-price').value) || 0;
  if (!price) {
    document.getElementById('w-price').focus();
    shake('w-price'); return;
  }

  const isEarn = currentType === 'earn';
  const cat    = document.getElementById('w-cat').value;
  const name   = document.getElementById('w-name').value.trim() || cat;
  const time   = document.getElementById('w-time').value || nowStr();
  const pay    = document.getElementById('w-pay').value;
  const today  = todayStr();

  // Load data
  let appData = {};
  try { appData = JSON.parse(localStorage.getItem(DATA_KEY)) || {}; } catch(e) {}
  if (!appData[today]) appData[today] = { earnings: [], expenses: [] };
  if (!appData[today].earnings) appData[today].earnings = [];
  if (!appData[today].expenses) appData[today].expenses = [];

  // Generate ID (max existing + 1)
  let maxId = 0;
  Object.values(appData).forEach(day => {
    [...(day.earnings||[]), ...(day.expenses||[])].forEach(e => { if (e.id > maxId) maxId = e.id; });
  });
  const id = maxId + 1;

  const entry = { id, name, cat, price, time, note: '', pay };

  if (isEarn) {
    appData[today].earnings.push(entry);
    // Credit wallet
    creditWallet(pay, price, name);
  } else {
    appData[today].expenses.push(entry);
    debitWallet(pay, price, name);
  }

  try { localStorage.setItem(DATA_KEY, JSON.stringify(appData)); } catch(e) {}

  // Feedback
  const wrap = document.querySelector('.wrap');
  wrap.classList.remove('flash-earn','flash-spend');
  void wrap.offsetWidth;
  wrap.classList.add(isEarn ? 'flash-earn' : 'flash-spend');

  showToast(isEarn
    ? `💰 +R$ ${price.toFixed(2).replace('.',',')} registrado!`
    : `💸 -R$ ${price.toFixed(2).replace('.',',')} registrado!`
  );

  // Reset
  document.getElementById('w-price').value = '';
  document.getElementById('w-name').value  = '';
  document.getElementById('w-time').value  = nowStr();
  document.getElementById('w-price').focus();
}

// ── WALLET HELPERS ───────────────────────────────────────────────────────
function loadWallet() {
  try { return JSON.parse(localStorage.getItem(WALLET_KEY)); } catch(e) { return null; }
}
function saveWallet(w) { localStorage.setItem(WALLET_KEY, JSON.stringify(w)); }

function creditWallet(pay, price, name) {
  const w = loadWallet(); if (!w) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR');
  const timeStr = now.toTimeString().slice(0,5);
  if (pay === '💵 Dinheiro') {
    const cash = w.accounts.find(a => a.id === 'cash');
    if (cash) { cash.balance += price; addWalletTx(w,'in',name,cash.name,price,cash.id,dateStr,timeStr); }
  } else if (pay === '📱 PIX') {
    const itau = w.accounts.find(a => a.id === 'bank_itau');
    if (itau) { itau.balance += price; addWalletTx(w,'in',name,itau.name,price,itau.id,dateStr,timeStr); }
  } else {
    const mp = w.accounts.find(a => a.id === 'bank_mercadopago');
    if (mp) { mp.balance += price; addWalletTx(w,'in',name,mp.name,price,mp.id,dateStr,timeStr); }
  }
  saveWallet(w);
}

function debitWallet(pay, price, name) {
  const w = loadWallet(); if (!w) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR');
  const timeStr = now.toTimeString().slice(0,5);
  let ac = null;
  if (pay === '💵 Dinheiro') ac = w.accounts.find(a => a.id === 'cash');
  else if (pay === '📱 PIX')  ac = w.accounts.find(a => a.id === 'bank_itau');
  else                         ac = w.accounts.find(a => a.id === 'bank_mercadopago');
  if (ac) { ac.balance -= price; addWalletTx(w,'out',name,ac.name,price,ac.id,dateStr,timeStr); saveWallet(w); }
}

function addWalletTx(w, kind, name, account, value, accountId, date, time) {
  if (!w.transactions) w.transactions = [];
  if (!w.nextId) w.nextId = 1;
  w.transactions.push({ id: w.nextId++, kind, name, account, to: null, value, accountId, date, time });
}

// ── TOAST ────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── SHAKE ────────────────────────────────────────────────────────────────
function shake(id) {
  const el = document.getElementById(id);
  el.style.animation = 'none'; void el.offsetWidth;
  el.style.animation = 'shake 0.3s ease';
}

// ── INIT ─────────────────────────────────────────────────────────────────
setType('earn');
document.getElementById('w-time').value = nowStr();
document.getElementById('w-price').focus();
</script>

<style>
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-6px); }
  75%      { transform: translateX(6px); }
}
</style>
</body>
</html>
